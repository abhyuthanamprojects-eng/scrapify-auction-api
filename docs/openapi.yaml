openapi: 3.0.3
info:
  title: Scrapify Auctions API
  description: >
    One API for three consumers: the React admin panel, the React public web app
    and the Flutter mobile app. Auth is Sanctum bearer tokens throughout (no
    session cookies). Public endpoints require no token; role-gated endpoints
    are enforced via permission middleware server-side.
  version: "1.0.0"
servers:
  - url: /api/v1
    description: Scrapify Auctions API v1

tags:
  - name: Auth
  - name: Categories
  - name: Auctions
  - name: Lots
  - name: Bids
  - name: Vendors
  - name: Organizations
  - name: Wallet
  - name: EMD
  - name: Orders
  - name: Tokens
  - name: Profile
  - name: Reports
  - name: Notifications
  - name: Audit Log
  - name: Watchlist
  - name: My Bids
  - name: RFx
  - name: Inspections
  - name: Gate Passes
  - name: Clarifications
  - name: Approvals
  - name: Awards
  - name: Disputes
  - name: Risk & Security

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user and vendor company
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 20 }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [buyer, seller] }
                company_name: { type: string, maxLength: 180 }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email or phone + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: "Email or phone" }
                password: { type: string }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Request an OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, description: "Email or phone" }
                purpose: { type: string, enum: [login, register, verify] }
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  expires_at: { type: string, format: date-time }
                  debug_code: { type: string, nullable: true, description: "Only present in local environment" }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify an OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  user: { allOf: [{ $ref: '#/components/schemas/User' }], nullable: true }
                  token: { type: string, nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------- categories
  /categories:
    get:
      tags: [Categories]
      summary: Category tree (two levels)
      security: []
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }
                        children:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                              slug: { type: string }
                  flat:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        parent_id: { type: integer, nullable: true }
                        name: { type: string }
                        slug: { type: string }

  # --------------------------------------------------------------- auctions
  /auctions:
    get:
      tags: [Auctions]
      summary: List auctions
      security: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: "Comma-separated list of statuses"
        - name: category
          in: query
          schema: { type: string }
        - name: company
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [forward, reverse] }
        - name: search
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: segment
          in: query
          schema: { type: string, enum: [live, upcoming, ended] }
        - name: per_page
          in: query
          schema: { type: integer, default: 25 }
      responses:
        '200':
          description: Paginated auction list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionPage' }
    post:
      tags: [Auctions]
      summary: Create an auction
      description: "Requires permission: auctions.create"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuctionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    get:
      tags: [Auctions]
      summary: Auction detail
      security: []
      responses:
        '200':
          description: Auction
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Auctions]
      summary: Update an auction
      description: "Requires permission: auctions.update. A closed or cancelled auction cannot be edited."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuctionInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/submit:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Submit auction for approval
      description: "Requires permission: auctions.submit. Only a draft or sent-back auction can be submitted."
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/approve:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Approve auction
      description: "Requires permission: auctions.approve"
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/send-back:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Send auction back with a review comment
      description: "Requires permission: auctions.send_back"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Sent back
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/reject:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Reject auction with a comment
      description: "Requires permission: auctions.reject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/publish:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Publish an approved auction
      description: "Requires permission: auctions.publish. Only an approved auction can be published."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  items: { type: string, maxLength: 60 }
                  example: ["Web Portal", "Mobile App", "Email"]
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/go-live:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Flip a published auction into live bidding
      description: "Requires permission: auctions.publish"
      responses:
        '200':
          description: Now live
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/extend:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Extend a live auction's end time
      description: "Requires permission: auctions.extend. Only a live auction can be extended."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes, reason]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 600 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Extended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/close:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Close an auction and settle the winner
      description: "Requires permission: auctions.close. Settles the winning bid, releases losing EMD holds."
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/cancel:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Cancel an auction
      description: "Requires permission: auctions.close"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Auction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/interested:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Auctions]
      summary: Mark interest in an auction (public or authenticated)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                anon_key:
                  type: string
                  maxLength: 64
                  description: "Required when the caller is not authenticated"
      responses:
        '201':
          description: Marked interested
          content:
            application/json:
              schema:
                type: object
                properties:
                  interested: { type: boolean }
                  interested_count: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Auctions]
      summary: Unmark interest in an auction
      security: []
      parameters:
        - name: anon_key
          in: query
          schema: { type: string }
          description: "Required when the caller is not authenticated"
      responses:
        '200':
          description: Unmarked
          content:
            application/json:
              schema:
                type: object
                properties:
                  interested: { type: boolean }
                  interested_count: { type: integer }

  /auctions/{code}/live-state:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    get:
      tags: [Auctions]
      summary: Lightweight polling fallback for live auction state
      security: []
      responses:
        '200':
          description: Live state snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  status: { type: string }
                  direction: { type: string }
                  current_highest_inr: { type: number, nullable: true }
                  bid_increment_inr: { type: number }
                  bidders: { type: integer }
                  schedule_end: { type: string, format: date-time, nullable: true }
                  seconds_remaining: { type: integer, nullable: true }
                  lots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        current_bid_inr: { type: number, nullable: true }
                        bidders: { type: integer }
                  server_time: { type: string, format: date-time }

  # ------------------------------------------------------------------- lots
  /auctions/{code}/lots:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    get:
      tags: [Lots]
      summary: List lots of an auction
      security: []
      responses:
        '200':
          description: Lot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lot' }
    post:
      tags: [Lots]
      summary: Add a lot to a lot-wise auction
      description: "Requires permission: lots.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 180 }
                quantity: { type: string, maxLength: 60, nullable: true }
                uom: { type: string, enum: [MT, KG, "Nos."] }
                reserve_price: { type: number, minimum: 0, nullable: true }
      responses:
        '201':
          description: Lot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lot' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/lots/{lot}:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
      - $ref: '#/components/parameters/LotCode'
    get:
      tags: [Lots]
      summary: Lot detail
      security: []
      responses:
        '200':
          description: Lot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lot' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Lots]
      summary: Update a lot
      description: "Requires permission: lots.manage. A closed lot cannot be edited."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 180 }
                quantity: { type: string, maxLength: 60, nullable: true }
                uom: { type: string, enum: [MT, KG, "Nos."] }
                reserve_price: { type: number, minimum: 0, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lot' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Lots]
      summary: Delete a lot
      description: "Requires permission: lots.manage. A lot that has received bids cannot be deleted."
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------- bids
  /auctions/{code}/bids:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    get:
      tags: [Bids]
      summary: Bid history for an auction
      security: []
      parameters:
        - name: lot
          in: query
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated bid list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidPage' }
    post:
      tags: [Bids]
      summary: Place a bid
      description: "Requires permission: bids.place"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0 }
                lot: { type: string, nullable: true, description: "Lot code, for lot-wise auctions" }
      responses:
        '201':
          description: Bid placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid: { $ref: '#/components/schemas/Bid' }
                  auction:
                    type: object
                    properties:
                      code: { type: string }
                      current_highest_inr: { type: number }
                      bidders: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auctions/{code}/proxy-bid:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    post:
      tags: [Bids]
      summary: Set an auto/proxy bid
      description: "Requires permission: bids.proxy. A ceiling for forward auctions, a floor for reverse tenders."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_amount]
              properties:
                max_amount: { type: number, minimum: 0 }
                lot: { type: string, nullable: true }
      responses:
        '201':
          description: Proxy bid set
          content:
            application/json:
              schema:
                type: object
                properties:
                  proxy_bid: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Bids]
      summary: Cancel a proxy bid
      description: "Requires permission: bids.proxy"
      parameters:
        - name: lot
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /my-bids:
    get:
      tags: [My Bids]
      summary: Bids grouped by active/won/lost for the current vendor
      responses:
        '200':
          description: Grouped bids
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: array
                    items: { $ref: '#/components/schemas/MyBidRow' }
                  won:
                    type: array
                    items: { $ref: '#/components/schemas/MyBidRow' }
                  lost:
                    type: array
                    items: { $ref: '#/components/schemas/MyBidRow' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- vendors
  /vendors:
    get:
      tags: [Vendors]
      summary: List vendors
      description: "Requires permission: vendors.view"
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: "Comma-separated list of statuses"
        - name: search
          in: query
          schema: { type: string }
        - name: material
          in: query
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, default: 25 }
      responses:
        '200':
          description: Paginated vendor list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPage' }

  /vendors/register:
    post:
      tags: [Vendors]
      summary: Vendor KYC registration (step 3 of signup wizard)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name, contact_name, email, phone]
              properties:
                company_name: { type: string, maxLength: 180 }
                location: { type: string, nullable: true, maxLength: 180 }
                address: { type: string, nullable: true }
                contact_name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 20 }
                gst_number: { type: string, nullable: true, maxLength: 20 }
                pan_number: { type: string, nullable: true, maxLength: 15 }
                license_number: { type: string, nullable: true, maxLength: 60 }
                material_interest:
                  type: array
                  items: { type: string }
                terms_accepted: { type: boolean }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendors/{code}:
    parameters:
      - $ref: '#/components/parameters/VendorCode'
    get:
      tags: [Vendors]
      summary: Vendor detail with documents and participation history
      description: "Requires permission: vendors.view"
      responses:
        '200':
          description: Vendor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vendors]
      summary: Update vendor details
      description: "Requires permission: vendors.update"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name: { type: string, maxLength: 180 }
                location: { type: string, nullable: true, maxLength: 180 }
                contact_name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 20 }
                gst_number: { type: string, nullable: true, maxLength: 20 }
                license_number: { type: string, nullable: true, maxLength: 60 }
                material_interest:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendors/{code}/approve:
    parameters:
      - $ref: '#/components/parameters/VendorCode'
    post:
      tags: [Vendors]
      summary: Approve vendor
      description: "Requires permission: vendors.approve"
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }

  /vendors/{code}/reject:
    parameters:
      - $ref: '#/components/parameters/VendorCode'
    post:
      tags: [Vendors]
      summary: Reject vendor
      description: "Requires permission: vendors.reject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendors/{code}/suspend:
    parameters:
      - $ref: '#/components/parameters/VendorCode'
    post:
      tags: [Vendors]
      summary: Suspend vendor
      description: "Requires permission: vendors.suspend"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vendor' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendors/{code}/documents:
    parameters:
      - $ref: '#/components/parameters/VendorCode'
    post:
      tags: [Vendors]
      summary: Upload a KYC document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_key, kind, file]
              properties:
                doc_key: { type: string, maxLength: 30 }
                kind: { type: string, maxLength: 60 }
                file: { type: string, format: binary, description: "Max 10MB" }
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendors/{code}/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/VendorCode'
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Vendors]
      summary: Review a KYC document
      description: "Requires permission: vendors.approve"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected, pending] }
                reason: { type: string, nullable: true, maxLength: 500, description: "Required if status is rejected" }
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vendors/{code}/registration-payment:
    parameters:
      - $ref: '#/components/parameters/VendorCode'
    post:
      tags: [Vendors]
      summary: Record the vendor registration fee payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, reference, amount]
              properties:
                method: { type: string, enum: [RTGS, NEFT, UPI] }
                reference: { type: string, maxLength: 60 }
                amount: { type: number, minimum: 0 }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { type: object }
                  vendor: { $ref: '#/components/schemas/Vendor' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ----------------------------------------------------------- organizations
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      description: "Requires permission: organizations.view"
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: "Comma-separated list of statuses"
        - name: search
          in: query
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, default: 25 }
      responses:
        '200':
          description: Paginated organization list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationPage' }
    post:
      tags: [Organizations]
      summary: Create an organization
      description: "Requires permission: organizations.create"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{code}:
    parameters:
      - $ref: '#/components/parameters/OrgCode'
    get:
      tags: [Organizations]
      summary: Organization detail
      description: "Requires permission: organizations.view"
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      summary: Update an organization
      description: "Requires permission: organizations.update. An approved organization cannot be edited."
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{code}/submit:
    parameters:
      - $ref: '#/components/parameters/OrgCode'
    post:
      tags: [Organizations]
      summary: Submit organization for super admin approval
      description: "Requires permission: organizations.submit. All declared units must be filled in first."
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{code}/approve:
    parameters:
      - $ref: '#/components/parameters/OrgCode'
    post:
      tags: [Organizations]
      summary: Approve organization (Super Admin only)
      description: "Requires permission: organizations.approve"
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organizations/{code}/reject:
    parameters:
      - $ref: '#/components/parameters/OrgCode'
    post:
      tags: [Organizations]
      summary: Reject organization
      description: "Requires permission: organizations.approve"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- wallet
  /wallet:
    get:
      tags: [Wallet]
      summary: Wallet balance
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance_inr: { type: number }
                  locked_inr: { type: number }
                  available_inr: { type: number }
                  currency: { type: string }

  /wallet/top-up:
    post:
      tags: [Wallet]
      summary: Add money to wallet
      description: "Requires permission: wallet.topup"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: number, minimum: 1 }
                method: { type: string, enum: [UPI, Card, "Net Banking", "Bank Transfer"] }
                note: { type: string, nullable: true, maxLength: 180 }
      responses:
        '201':
          description: Credited
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction: { type: object }
                  balance_inr: { type: number }
        '422': { $ref: '#/components/responses/ValidationError' }

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: Wallet transaction history
      parameters:
        - name: type
          in: query
          schema: { type: string }
          description: "Comma-separated list of transaction types"
        - name: per_page
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        type: { type: string }
                        amount_inr: { type: number, description: "Signed: credit positive, debit negative" }
                        balance_after_inr: { type: number, nullable: true }
                        note: { type: string, nullable: true }
                        method: { type: string, nullable: true }
                        status: { type: string }
                        reference: { type: string, nullable: true }
                        at: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  # ------------------------------------------------------------------- emd
  /emd:
    get:
      tags: [EMD]
      summary: List EMD holds
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: auction
          in: query
          schema: { type: string }
      responses:
        '200':
          description: EMD list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Emd' }

  /emd/lock:
    post:
      tags: [EMD]
      summary: Lock EMD for an auction
      description: "Requires permission: emd.lock or emd.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auction_id]
              properties:
                auction_id: { type: string, description: "Auction code" }
                lot: { type: string, nullable: true, description: "Lot code" }
      responses:
        '201':
          description: Locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  emd: { type: object }
                  wallet: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /emd/{id}/release:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [EMD]
      summary: Release an EMD hold
      description: "A bidder may release their own hold only once the auction is closed or cancelled. Staff with emd.manage may release any time."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, default: "Released" }
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                type: object
                properties:
                  emd: { $ref: '#/components/schemas/Emd' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /emd/{id}/forfeit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [EMD]
      summary: Forfeit an EMD hold
      description: "Requires permission: emd.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Forfeited
          content:
            application/json:
              schema:
                type: object
                properties:
                  emd: { $ref: '#/components/schemas/Emd' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- orders
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      description: "Staff with orders.manage see all orders; others see only their own vendor's orders."
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
    post:
      tags: [Orders]
      summary: Create an order for a closed auction's winner
      description: "Requires permission: orders.manage. Idempotent per auction/lot."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auction_id]
              properties:
                auction_id: { type: string, description: "Auction code" }
                lot: { type: string, nullable: true, description: "Lot code" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{code}:
    parameters:
      - $ref: '#/components/parameters/OrderCode'
    get:
      tags: [Orders]
      summary: Order detail
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{code}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderCode'
    post:
      tags: [Orders]
      summary: Pay the outstanding balance
      description: "Requires permission: orders.pay or orders.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, maxLength: 40 }
                reference: { type: string, nullable: true, maxLength: 60 }
      responses:
        '200':
          description: Paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
                  payment: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{code}/pickup:
    parameters:
      - $ref: '#/components/parameters/OrderCode'
    post:
      tags: [Orders]
      summary: Schedule a pickup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [window_start, window_end]
              properties:
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
                address_id: { type: integer, nullable: true }
                warehouse: { type: string, nullable: true, maxLength: 180 }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201':
          description: Pickup scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  pickup: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{code}/weighbridge:
    parameters:
      - $ref: '#/components/parameters/OrderCode'
    post:
      tags: [Orders]
      summary: Record weighbridge reading
      description: "Requires permission: orders.manage. Short weight is refunded pro rata to the winning bid via wallet credit."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declared_kg, actual_kg]
              properties:
                declared_kg: { type: number, minimum: 0 }
                actual_kg: { type: number, minimum: 0 }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  weighbridge: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /orders/{code}/handover:
    parameters:
      - $ref: '#/components/parameters/OrderCode'
    post:
      tags: [Orders]
      summary: Verify handover OTP and mark picked up
      description: "Requires permission: orders.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Handover verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  order: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- tokens
  /tokens:
    get:
      tags: [Tokens]
      summary: List access tokens
      description: "Requires permission: tokens.view"
      parameters:
        - name: auction
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated token list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPage' }
    post:
      tags: [Tokens]
      summary: Generate an access token for an auction
      description: "Requires permission: tokens.create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auction_id, type, expires_at]
              properties:
                auction_id: { type: string, description: "Auction code" }
                type: { type: string, enum: [view_only, can_bid] }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Token' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tokens/validate/{token}:
    get:
      tags: [Tokens]
      summary: Validate an access token (public)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Valid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  type: { type: string }
                  can_bid: { type: boolean }
                  expires_at: { type: string, format: date-time }
                  auction: { $ref: '#/components/schemas/Auction' }
        '403':
          description: Token expired or revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: false }
                  reason: { type: string }
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: false }
                  reason: { type: string, example: not_found }

  /tokens/{code}/revoke:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Tokens]
      summary: Revoke an access token
      description: "Requires permission: tokens.revoke"
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Token' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # --------------------------------------------------------------- profile
  /profile:
    patch:
      tags: [Profile]
      summary: Update own profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /profile/addresses:
    get:
      tags: [Profile]
      summary: List addresses
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Profile]
      summary: Add an address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, line]
              properties:
                label: { type: string, nullable: true, maxLength: 40 }
                name: { type: string, maxLength: 120 }
                line: { type: string, maxLength: 255 }
                city: { type: string, nullable: true, maxLength: 80 }
                state: { type: string, nullable: true, maxLength: 80 }
                pincode: { type: string, nullable: true, maxLength: 10 }
                phone: { type: string, nullable: true, maxLength: 20 }
                is_default: { type: boolean }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { $ref: '#/components/schemas/Address' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /profile/addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Profile]
      summary: Update an address
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, nullable: true, maxLength: 40 }
                name: { type: string, maxLength: 120 }
                line: { type: string, maxLength: 255 }
                city: { type: string, nullable: true, maxLength: 80 }
                state: { type: string, nullable: true, maxLength: 80 }
                pincode: { type: string, nullable: true, maxLength: 10 }
                phone: { type: string, nullable: true, maxLength: 20 }
                is_default: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { $ref: '#/components/schemas/Address' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Profile]
      summary: Delete an address
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /profile/payment-methods:
    get:
      tags: [Profile]
      summary: List payment methods
      responses:
        '200':
          description: Payment method list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentMethod' }
    post:
      tags: [Profile]
      summary: Add a payment method
      description: "Masked display label only — no card numbers or bank credentials are accepted."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, label]
              properties:
                type: { type: string, enum: [UPI, Card, Bank] }
                label: { type: string, maxLength: 60 }
                subtitle: { type: string, nullable: true, maxLength: 80 }
                is_primary: { type: boolean }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /profile/payment-methods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Profile]
      summary: Delete a payment method
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # --------------------------------------------------------------- reports
  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Dashboard KPIs, activity feed and category mix
      description: "Requires permission: reports.view"
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpis:
                    type: object
                    properties:
                      pending_vendors: { type: integer }
                      pending_organizations: { type: integer }
                      live_auctions: { type: integer }
                      auctions_awaiting_publish: { type: integer }
                      total_vendors: { type: integer }
                  needs_attention:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [Auction, Vendor] }
                        name: { type: string }
                        submitted_at: { type: string, format: date-time, nullable: true }
                        hours_waiting: { type: integer, nullable: true }
                  activity:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        actor: { type: string, nullable: true }
                        action: { type: string }
                        at: { type: string, format: date-time }
                  category_mix:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        value: { type: integer }

  /reports/auctions:
    get:
      tags: [Reports]
      summary: Auction report with summary and filters
      description: "Requires permission: reports.view"
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: company
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total_auctions: { type: integer }
                      total_value_inr: { type: number }
                      avg_uplift_pct: { type: number }
                      top_category: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        auction_id: { type: string }
                        title: { type: string }
                        company: { type: string }
                        category: { type: string, nullable: true }
                        location: { type: string, nullable: true }
                        starting_price_inr: { type: number }
                        reserve_price_inr: { type: number }
                        final_price_inr: { type: number }
                        bidders: { type: integer }
                        winner: { type: string, nullable: true }
                        status: { type: string }
                        closed_at: { type: string, format: date-time, nullable: true }

  /reports/auctions/{code}/h1:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    get:
      tags: [Reports]
      summary: H1 commercial summary (per-lot breakdown with taxes)
      description: "Requires permission: reports.view"
      responses:
        '200':
          description: H1 report
          content:
            application/json:
              schema:
                type: object
                properties:
                  auction:
                    type: object
                    properties:
                      id: { type: string }
                      company: { type: string }
                      title: { type: string }
                      department: { type: string }
                      start: { type: string, format: date-time, nullable: true }
                      end: { type: string, format: date-time, nullable: true }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        sr_no: { type: integer }
                        lot_no: { type: string }
                        item_name: { type: string }
                        location: { type: string, nullable: true }
                        qty_uom: { type: string, nullable: true }
                        starting_price_inr: { type: number }
                        reserve_price_inr: { type: number }
                        sta_pct: { type: number }
                        h1_bid_inr: { type: number }
                        h1_bidder_name: { type: string, nullable: true }
                        h1_bidder_email: { type: string, nullable: true }
                        status: { type: string, enum: [Sold, Unsold] }
                        closing_price_inr: { type: number }
                        emd_hold_inr: { type: number }
                        gst_pct: { type: number }
                        gst_amount_inr: { type: number }
                        tcs_pct: { type: number }
                        tcs_amount_inr: { type: number }
                        total_with_taxes_inr: { type: number }
                        balance_after_emd_inr: { type: number }
                  generated_at: { type: string, format: date-time }

  /reports/auctions/{code}/all-bids:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    get:
      tags: [Reports]
      summary: All bids on an auction (report)
      description: "Requires permission: reports.view"
      responses:
        '200':
          description: All-bids report
          content:
            application/json:
              schema:
                type: object
                properties:
                  auction:
                    type: object
                    properties:
                      id: { type: string }
                      company: { type: string }
                      title: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        sr_no: { type: integer }
                        company_name: { type: string, nullable: true }
                        vendor_id: { type: string, nullable: true }
                        mobile: { type: string, nullable: true }
                        email: { type: string, nullable: true }
                        bid_date: { type: string, format: date }
                        bid_time: { type: string }
                        bid_price_inr: { type: number }
                        ip: { type: string, nullable: true }
                        location: { type: string, nullable: true }

  /reports/auctions/{code}/all-bidders:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    get:
      tags: [Reports]
      summary: All distinct bidders on an auction (report)
      description: "Requires permission: reports.view"
      responses:
        '200':
          description: All-bidders report
          content:
            application/json:
              schema:
                type: object
                properties:
                  auction:
                    type: object
                    properties:
                      id: { type: string }
                      company: { type: string }
                      title: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        sr_no: { type: integer }
                        company_name: { type: string }
                        vendor_id: { type: string }
                        mobile: { type: string, nullable: true }
                        email: { type: string, nullable: true }
                        gst_no: { type: string, nullable: true }
                        gst_address: { type: string, nullable: true }
                        location: { type: string, nullable: true }

  # ---------------------------------------------------------- notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - name: per_page
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unread_count: { type: integer }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Notifications]
      summary: Mark one notification read
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications read
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /notification-preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: array
                    items:
                      type: object
                      properties:
                        group: { type: string, nullable: true }
                        key: { type: string }
                        enabled: { type: boolean }
    put:
      tags: [Notifications]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  items:
                    type: object
                    required: [key, enabled]
                    properties:
                      key: { type: string, maxLength: 60 }
                      group: { type: string, nullable: true, maxLength: 60 }
                      enabled: { type: boolean }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ----------------------------------------------------------------- audit
  /audit-logs:
    get:
      tags: [Audit Log]
      summary: Searchable audit log
      description: "Requires permission: audit.view. Read-only — there is no store/update/destroy endpoint."
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        at: { type: string, format: date-time, nullable: true }
                        user: { type: string, nullable: true }
                        role: { type: string, nullable: true }
                        action: { type: string }
                        entity_type: { type: string, nullable: true }
                        entity_id: { type: string, nullable: true }
                        ip: { type: string, nullable: true }
                        meta: { type: object, nullable: true }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  # ------------------------------------------------------------- watchlist
  /watchlist:
    get:
      tags: [Watchlist]
      summary: List watchlisted auctions
      responses:
        '200':
          description: Watchlisted auctions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Auction' }
    post:
      tags: [Watchlist]
      summary: Add an auction (or lot) to the watchlist
      description: "Requires permission: watchlist.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auction_id]
              properties:
                auction_id: { type: string, description: "Auction code" }
                lot: { type: string, nullable: true, description: "Lot code" }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  watchlist: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }

  /watchlist/{code}:
    parameters:
      - $ref: '#/components/parameters/AuctionCode'
    delete:
      tags: [Watchlist]
      summary: Remove an auction from the watchlist
      description: "Requires permission: watchlist.manage"
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Sanctum personal access token"

  parameters:
    AuctionCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: "Auction code, e.g. AUC-0001"
    LotCode:
      name: lot
      in: path
      required: true
      schema: { type: string }
      description: "Lot code, e.g. AUC-0001-L1"
    VendorCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: "Vendor code"
    OrgCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: "Organization code"
    OrderCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: "Order code"

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Unauthenticated. }
    Forbidden:
      description: Caller lacks the required permission
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: "No query results for model." }

  schemas:
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    User:
      type: object
      properties:
        id: { type: string, description: "UUID" }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { type: string }
        role_label: { type: string }
        status: { type: string }
        permissions:
          type: array
          items: { type: string }
        organization:
          type: object
          nullable: true
          properties:
            id: { type: string }
            company_name: { type: string }
        vendor:
          type: object
          nullable: true
          properties:
            id: { type: string }
            company_name: { type: string }
            status: { type: string }
            can_bid: { type: boolean }
        email_verified_at: { type: string, format: date-time, nullable: true }
        phone_verified_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }

    Auction:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        company: { type: string }
        plant: { type: string, nullable: true }
        warehouse: { type: string, nullable: true }
        location: { type: string, nullable: true }
        organization_id: { type: string, nullable: true }
        category: { type: string, nullable: true }
        category_id: { type: integer, nullable: true }
        lot_type: { type: string, enum: [single, lot_wise] }
        direction: { type: string, enum: [forward, reverse] }
        material_type: { type: string, nullable: true }
        quantity: { type: string, nullable: true }
        uom: { type: string, enum: [MT, KG, "Nos."] }
        reserve_price_inr: { type: number, nullable: true }
        reserve_na: { type: boolean }
        starting_price_inr: { type: number, nullable: true }
        bid_increment_inr: { type: number }
        emd_amount_inr: { type: number }
        current_highest_inr: { type: number, nullable: true }
        bidders: { type: integer }
        status:
          type: string
          enum: [draft, pending_approval, sent_back, approved, rejected, published, live, closed, cancelled]
        submitted_by: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        schedule_start: { type: string, format: date-time, nullable: true }
        schedule_end: { type: string, format: date-time, nullable: true }
        inspection: { type: string, nullable: true }
        inspection_date: { type: string, nullable: true }
        inspection_time: { type: string, nullable: true }
        inspection_location: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        payment_terms: { type: string, nullable: true }
        lifting_period: { type: string, nullable: true }
        lifting_unit: { type: string, enum: [Days, Weeks], nullable: true }
        contact:
          type: object
          properties:
            name: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
        photos:
          type: array
          items: { type: string }
        sub_lots:
          type: array
          items: { $ref: '#/components/schemas/Lot' }
        bids:
          type: array
          items: { $ref: '#/components/schemas/Bid' }
        extensions:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              minutes: { type: integer }
              at: { type: string, format: date-time }
        review_comment: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        publish_channels:
          type: array
          items: { type: string }
          nullable: true
        closed_at: { type: string, format: date-time, nullable: true }
        final_price_inr: { type: number, nullable: true }
        winner: { type: string, nullable: true }
        interested_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

    AuctionInput:
      type: object
      required: [title, company]
      properties:
        title: { type: string, maxLength: 200 }
        company: { type: string, maxLength: 180 }
        organization_code: { type: string, nullable: true }
        plant: { type: string, nullable: true, maxLength: 180 }
        warehouse: { type: string, nullable: true, maxLength: 180 }
        location: { type: string, nullable: true, maxLength: 180 }
        category: { type: string, nullable: true, description: "Category slug or name" }
        lot_type: { type: string, enum: [single, lot_wise] }
        direction: { type: string, enum: [forward, reverse] }
        material_type: { type: string, nullable: true, maxLength: 180 }
        quantity: { type: string, nullable: true, maxLength: 60 }
        uom: { type: string, enum: [MT, KG, "Nos."] }
        reserve_price: { type: number, nullable: true, minimum: 0 }
        reserve_na: { type: boolean }
        starting_price: { type: number, nullable: true, minimum: 0 }
        bid_increment: { type: number, minimum: 0 }
        emd_amount: { type: number, minimum: 0 }
        status: { type: string, enum: [draft, pending_approval] }
        schedule_start: { type: string, format: date-time, nullable: true }
        schedule_end: { type: string, format: date-time, nullable: true, description: "Must be after schedule_start" }
        inspection: { type: string, nullable: true }
        inspection_date: { type: string, nullable: true, maxLength: 60 }
        inspection_time: { type: string, nullable: true, maxLength: 60 }
        inspection_location: { type: string, nullable: true, maxLength: 180 }
        guidelines_doc: { type: string, nullable: true, maxLength: 255 }
        terms: { type: string, nullable: true }
        payment_terms: { type: string, nullable: true, maxLength: 255 }
        lifting_period: { type: string, nullable: true, maxLength: 30 }
        lifting_unit: { type: string, enum: [Days, Weeks] }
        contact_name: { type: string, nullable: true, maxLength: 120 }
        contact_phone: { type: string, nullable: true, maxLength: 30 }
        contact_email: { type: string, nullable: true, format: email }
        photos:
          type: array
          items: { type: string }
        sub_lots:
          type: array
          items:
            type: object
            properties:
              name: { type: string, nullable: true, maxLength: 180 }
              quantity: { type: string, nullable: true, maxLength: 60 }
              uom: { type: string, enum: [MT, KG, "Nos."] }
              reserve_price: { type: number, nullable: true, minimum: 0 }

    Lot:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        auction_id: { type: string, nullable: true }
        name: { type: string }
        quantity: { type: string, nullable: true }
        uom: { type: string, enum: [MT, KG, "Nos."] }
        reserve_price_inr: { type: number, nullable: true }
        current_bid_inr: { type: number, nullable: true }
        bidders: { type: integer }
        status: { type: string }
        final_price_inr: { type: number, nullable: true }

    Bid:
      type: object
      properties:
        id: { type: integer }
        auction_id: { type: string, nullable: true }
        sub_lot_id: { type: string, nullable: true }
        vendor_id: { type: string, nullable: true }
        vendor_name: { type: string, nullable: true }
        amount_inr: { type: number }
        is_proxy: { type: boolean }
        at: { type: string, format: date-time, nullable: true }

    MyBidRow:
      type: object
      properties:
        auction_id: { type: string }
        title: { type: string }
        status: { type: string }
        my_bid_inr: { type: number }
        current_inr: { type: number }
        bid_count: { type: integer }
        result: { type: string, enum: [Winning, Outbid, Won, Lost] }

    Vendor:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        company_name: { type: string }
        location: { type: string, nullable: true }
        address: { type: string, nullable: true }
        contact_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        gst_number: { type: string, nullable: true }
        pan_number: { type: string, nullable: true }
        license_number: { type: string, nullable: true }
        material_interest:
          type: array
          items: { type: string }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        rejection_reason: { type: string, nullable: true }
        suspension_reason: { type: string, nullable: true }
        registration_step: { type: integer }
        registration_payment:
          type: object
          properties:
            method: { type: string, nullable: true }
            reference: { type: string, nullable: true }
            status: { type: string, nullable: true }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              key: { type: string }
              kind: { type: string }
              name: { type: string }
              file_name: { type: string, nullable: true }
              size_kb: { type: integer, nullable: true }
              required: { type: boolean, nullable: true }
              status: { type: string }
              reason: { type: string, nullable: true }
              approved_on: { type: string, format: date-time, nullable: true }
              uploaded_at: { type: string, format: date-time, nullable: true }
        participation:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: string }
              auction: { type: string }
              date: { type: string, format: date }
              bids: { type: integer }
              won: { type: boolean }
              amount_inr: { type: number }
        created_at: { type: string, format: date-time, nullable: true }

    Organization:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        company_name: { type: string }
        location: { type: string, nullable: true }
        total_units: { type: integer }
        status: { type: string, enum: [draft, pending_super_admin_approval, approved, rejected] }
        rejection_reason: { type: string, nullable: true }
        bank:
          type: object
          nullable: true
          properties:
            account_number: { type: string, nullable: true }
            ifsc: { type: string, nullable: true }
            bank_name: { type: string, nullable: true }
        units:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              gst: { type: string }
              location: { type: string }
              bank:
                type: object
                properties:
                  account_number: { type: string, nullable: true }
                  ifsc: { type: string, nullable: true }
                  bank_name: { type: string, nullable: true }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              file_name: { type: string }
              uploaded_at: { type: string, format: date-time, nullable: true }
        plants:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              warehouses:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
        created_at: { type: string, format: date-time, nullable: true }

    OrganizationInput:
      type: object
      required: [company_name, location, total_units]
      properties:
        company_name: { type: string, maxLength: 180 }
        location: { type: string, maxLength: 255 }
        total_units: { type: integer, minimum: 0, maximum: 50 }
        status: { type: string, enum: [draft, pending_super_admin_approval] }
        bank:
          type: object
          properties:
            account_number: { type: string, nullable: true, maxLength: 40 }
            ifsc: { type: string, nullable: true, maxLength: 20 }
            bank_name: { type: string, nullable: true, maxLength: 120 }
        units:
          type: array
          items:
            type: object
            required: [name, gst, location, bank]
            properties:
              name: { type: string, maxLength: 180 }
              gst: { type: string, maxLength: 20 }
              location: { type: string, maxLength: 180 }
              bank:
                type: object
                required: [account_number, ifsc, bank_name]
                properties:
                  account_number: { type: string, maxLength: 40 }
                  ifsc: { type: string, maxLength: 20 }
                  bank_name: { type: string, maxLength: 120 }
        documents:
          type: array
          items:
            type: object
            required: [type, file_name]
            properties:
              type: { type: string, maxLength: 80 }
              file_name: { type: string, maxLength: 255 }

    Token:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        auction_id: { type: string, nullable: true }
        type: { type: string, enum: [view_only, can_bid] }
        status: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        share_link: { type: string }

    Order:
      type: object
      properties:
        id: { type: string }
        auction_id: { type: string, nullable: true }
        lot_id: { type: string, nullable: true }
        title: { type: string, nullable: true }
        vendor_id: { type: string, nullable: true }
        winning_amount_inr: { type: number }
        emd_applied_inr: { type: number }
        gst_amount_inr: { type: number }
        tcs_amount_inr: { type: number }
        total_amount_inr: { type: number }
        balance_due_inr: { type: number }
        status:
          type: string
          enum: [awaiting_payment, paid, pickup_scheduled, picked_up]
        payment_due_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        handover_otp: { type: string, nullable: true, description: "Only visible to the winning vendor" }
        pickup:
          type: object
          nullable: true
          properties:
            window_start: { type: string, format: date-time, nullable: true }
            window_end: { type: string, format: date-time, nullable: true }
            warehouse: { type: string, nullable: true }
            status: { type: string }
        weighbridge:
          type: object
          nullable: true
          properties:
            declared_kg: { type: number }
            actual_kg: { type: number }
            adjustment_inr: { type: number }
        documents:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              file_name: { type: string, nullable: true }

    Emd:
      type: object
      properties:
        id: { type: integer }
        auction_id: { type: string, nullable: true }
        vendor_id: { type: string, nullable: true }
        vendor_name: { type: string, nullable: true }
        amount_inr: { type: number }
        status: { type: string, enum: [locked, released, forfeited] }
        reference: { type: string, nullable: true }
        locked_at: { type: string, format: date-time, nullable: true }
        released_at: { type: string, format: date-time, nullable: true }

    Address:
      type: object
      properties:
        id: { type: integer }
        label: { type: string, nullable: true }
        name: { type: string }
        line: { type: string }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        pincode: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        is_default: { type: boolean }

    PaymentMethod:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [UPI, Card, Bank] }
        label: { type: string }
        subtitle: { type: string, nullable: true }
        is_primary: { type: boolean }

    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string, nullable: true }
        body: { type: string, nullable: true }
        data: { type: object, nullable: true }
        read: { type: boolean }
        at: { type: string, format: date-time, nullable: true }

    AuctionPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Auction' }
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta: { $ref: '#/components/schemas/PageMeta' }

    BidPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Bid' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    VendorPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Vendor' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    OrganizationPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    TokenPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Token' }
        meta: { $ref: '#/components/schemas/PageMeta' }

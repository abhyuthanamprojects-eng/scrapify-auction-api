name: Deploy Laravel API to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,pdo,pdo_mysql,bcmath,ctype,json

      - name: Install Composer
        uses: php-actions/composer@v6
        with:
          version: 2
          args: --no-dev --optimize-autoloader

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laravel-build
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laravel-build

      - name: Deploy to Hostinger via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: "."
          target: "/home/u551475123/domains/api.scrapifyauctions.com/deploy-temp"
          strip_components: 0

      - name: Setup and Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e

            echo "=============================="
            echo "Finalizing Laravel API Deployment"
            echo "=============================="

            DEPLOY_PATH="/home/u551475123/domains/api.scrapifyauctions.com"
            TEMP_PATH="$DEPLOY_PATH/deploy-temp"

            # Backup current deployment
            if [ -d "$DEPLOY_PATH/public_html" ]; then
              echo "✓ Backing up current deployment..."
              rm -rf $DEPLOY_PATH/public_html-old
              mv $DEPLOY_PATH/public_html $DEPLOY_PATH/public_html-old
            fi

            # Move new files to public_html
            echo "✓ Activating new deployment..."
            mv $TEMP_PATH $DEPLOY_PATH/public_html

            cd $DEPLOY_PATH/public_html

            echo "✓ Setting up .env file..."
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            # Update .env with secrets using proper escaping
            sed -i 's|APP_URL=.*|APP_URL=${{ secrets.APP_URL }}|g' .env
            sed -i 's|DB_HOST=.*|DB_HOST=${{ secrets.DB_HOST }}|g' .env
            sed -i 's|DB_PORT=.*|DB_PORT=${{ secrets.DB_PORT }}|g' .env
            sed -i 's|DB_DATABASE=.*|DB_DATABASE=${{ secrets.DB_DATABASE }}|g' .env
            sed -i 's|DB_USERNAME=.*|DB_USERNAME=${{ secrets.DB_USERNAME }}|g' .env
            sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|g' .env

            echo "✓ Generating application key..."
            php artisan key:generate --force 2>/dev/null || true

            echo "✓ Running database migrations..."
            php artisan migrate --force 2>/dev/null || true

            echo "✓ Clearing caches..."
            php artisan config:cache 2>/dev/null || true
            php artisan route:cache 2>/dev/null || true

            echo "✓ Setting file permissions..."
            chmod -R 755 $DEPLOY_PATH/public_html
            chmod -R 775 $DEPLOY_PATH/public_html/storage
            chmod -R 775 $DEPLOY_PATH/public_html/bootstrap/cache

            echo ""
            echo "=============================="
            echo "✓ Deployment Successful!"
            echo "API URL: https://api.scrapifyauctions.com"
            echo "=============================="

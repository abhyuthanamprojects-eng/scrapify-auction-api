name: Deploy Laravel API to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scrapify-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build production dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
          tools: composer

      - name: Install production dependencies on runner
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts

      - name: Package production dependencies
        run: tar -czf "$RUNNER_TEMP/scrapify-vendor.tar.gz" vendor

      - name: Upload production dependencies
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: ${{ runner.temp }}/scrapify-vendor.tar.gz
          target: /home/u551475123/domains/api.scrapifyauctions.com
          overwrite: true

      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            echo "=============================="
            echo "Deploying Laravel API"
            echo "=============================="

            DEPLOY_PATH="/home/u551475123/domains/api.scrapifyauctions.com"
            REPO_URL="https://github.com/abhyuthanamprojects-eng/scrapify-auction-api.git"

            mkdir -p "$DEPLOY_PATH"

            # 1. Clone or update repository
            if [ -d "$DEPLOY_PATH/repo/.git" ]; then
              echo "✓ Updating repository..."
              cd $DEPLOY_PATH/repo
              git fetch --prune origin main
              git reset --hard origin/main
            else
              echo "✓ Cloning repository..."
              git clone --depth 1 "$REPO_URL" "$DEPLOY_PATH/repo"
            fi

            # 2. Copy Laravel app files to parent directory (NOT public_html)
            echo "✓ Syncing Laravel app files..."
            for dir in app bootstrap config database resources routes storage vendor; do
              rm -rf "$DEPLOY_PATH/$dir"
              cp -r "$DEPLOY_PATH/repo/$dir" "$DEPLOY_PATH/$dir"
            done

            # Composer is blocked by Hostinger's DISEVAL hardening. Dependencies
            # are resolved on the GitHub runner and uploaded as an artifact.
            echo "✓ Installing uploaded production dependencies..."
            test -f "$DEPLOY_PATH/scrapify-vendor.tar.gz"
            rm -rf "$DEPLOY_PATH/vendor"
            tar -xzf "$DEPLOY_PATH/scrapify-vendor.tar.gz" -C "$DEPLOY_PATH"
            rm -f "$DEPLOY_PATH/scrapify-vendor.tar.gz"
            for file in artisan composer.json composer.lock; do
              cp "$DEPLOY_PATH/repo/$file" "$DEPLOY_PATH/$file"
            done

            # 3. Copy ONLY public/ contents into public_html (the web root)
            echo "✓ Syncing public_html..."
            mkdir -p "$DEPLOY_PATH/public_html"
            cp "$DEPLOY_PATH/repo/public/index.php" "$DEPLOY_PATH/public_html/index.php"
            if [ -f "$DEPLOY_PATH/repo/public/robots.txt" ]; then cp "$DEPLOY_PATH/repo/public/robots.txt" "$DEPLOY_PATH/public_html/robots.txt"; fi
            if [ -f "$DEPLOY_PATH/repo/public/favicon.ico" ]; then cp "$DEPLOY_PATH/repo/public/favicon.ico" "$DEPLOY_PATH/public_html/favicon.ico"; fi

            # 4. Create .htaccess for URL rewriting
            cat > $DEPLOY_PATH/public_html/.htaccess << 'HTEOF'
            <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteBase /
                RewriteCond %{HTTP:Authorization} .
                RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteCond %{REQUEST_URI} (.+)/$
                RewriteRule ^ %1 [L,R=301]
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteRule ^ index.php [L]
            </IfModule>
            HTEOF

            # 5. Create storage symlink manually (exec() is disabled)
            ln -sfn "$DEPLOY_PATH/storage/app/public" "$DEPLOY_PATH/public_html/storage"

            # 6. Setup .env — preserve existing, create from example on first deploy
            echo "✓ Setting up .env..."
            if [ ! -f "$DEPLOY_PATH/.env" ]; then
              cp "$DEPLOY_PATH/repo/.env.example" "$DEPLOY_PATH/.env"
            fi
            cd $DEPLOY_PATH
            sed -i "s|^APP_URL=.*|APP_URL=${{ secrets.APP_URL }}|" .env
            sed -i "s|^DB_HOST=.*|DB_HOST=localhost|" .env
            sed -i "s|^DB_PORT=.*|DB_PORT=${{ secrets.DB_PORT }}|" .env
            sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${{ secrets.DB_DATABASE }}|" .env
            sed -i "s|^DB_USERNAME=.*|DB_USERNAME=${{ secrets.DB_USERNAME }}|" .env
            sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD="${{ secrets.DB_PASSWORD }}"|' .env

            # Hostinger ships Sodium but excludes it from the default CLI
            # scan path. Enable the provider-managed standard extensions for
            # every Composer and Artisan command in this deployment.
            export PHP_INI_SCAN_DIR="/opt/alt/php83/etc/php.d.std"
            if ! php -m | grep -qi '^sodium$'; then
              echo "ERROR: PHP Sodium extension is unavailable; refusing deployment."
              exit 1
            fi

            # 7. Generate app key only if not set
            echo "✓ Checking application key..."
            if ! grep -q "^APP_KEY=base64:" $DEPLOY_PATH/.env; then
              php artisan key:generate --force
            fi

            # 8. Clear stale compiled state before booting the new release.
            echo "✓ Clearing Laravel caches..."
            php artisan package:discover --ansi
            php artisan optimize:clear
            php artisan about >/dev/null

            # 10. Run only migrations not recorded in the production database.
            # Never replace this with migrate:fresh/refresh/reset/db:wipe.
            echo "✓ Running pending database migrations..."
            php artisan migrate --force

            # 11. Rebuild the supported optimized cache set.
            echo "✓ Rebuilding Laravel optimized caches..."
            php artisan optimize

            # 12. Ask workers to reload code. Queue restart is harmless for a
            # sync/no-worker setup; Horizon is terminated only when installed.
            echo "✓ Reloading queue workers..."
            php artisan queue:restart || {
              if [ "$(php -r 'echo config("queue.default");')" != "sync" ]; then exit 1; fi
              echo "  Queue workers are not configured; continuing."
            }
            if php -r 'exit(class_exists("Laravel\\Horizon\\HorizonServiceProvider") ? 0 : 1);'; then
              php artisan horizon:terminate
            fi

            # 13. Verify migration state and Laravel bootstrap before success.
            echo "✓ Verifying migration state..."
            php artisan migrate:status
            php artisan about >/dev/null

            # 10. Set permissions
            echo "✓ Setting file permissions..."
            chmod -R 755 "$DEPLOY_PATH/public_html"
            chmod 644 "$DEPLOY_PATH/public_html/.htaccess"
            chmod 644 "$DEPLOY_PATH/public_html/index.php"
            chmod -R 775 "$DEPLOY_PATH/storage"
            chmod -R 775 "$DEPLOY_PATH/bootstrap/cache"

            echo ""
            echo "=============================="
            echo "✓ Deployment Complete!"
            echo "API URL: https://api.scrapifyauctions.com"
            echo "=============================="
